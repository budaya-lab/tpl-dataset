name: Validate metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install pinned validator and test tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck template tooling
        run: pnpm typecheck
      - name: Test template tooling
        run: pnpm test
      - name: Validate Data Package
        run: pnpm validate
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
